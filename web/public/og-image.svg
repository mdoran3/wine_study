<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1220"/>
      <stop offset="55%" style="stop-color:#5e2230"/>
      <stop offset="100%" style="stop-color:#7b2d3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle horizontal sheen -->
  <rect width="1200" height="2" y="314" fill="url(#accent)"/>

  <!-- Decorative border -->
  <rect x="32" y="32" width="1136" height="566" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="44" y="44" width="1112" height="542" rx="8" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Emojis -->
  <text x="420" y="220" font-size="80" text-anchor="middle" dominant-baseline="middle">🍇</text>
  <text x="600" y="210" font-size="96" text-anchor="middle" dominant-baseline="middle">🍽️</text>
  <text x="780" y="220" font-size="80" text-anchor="middle" dominant-baseline="middle">🐟</text>

  <!-- Main title -->
  <text x="600" y="315" font-family="Georgia, serif" font-size="64" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">Mesón Sabika</text>

  <!-- Divider line -->
  <line x1="440" y1="360" x2="760" y2="360" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="600" y="405" font-family="Georgia, serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.75)" text-anchor="middle" dominant-baseline="middle" letter-spacing="3">SERVER EDUCATION</text>

  <!-- URL -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">mesoneducation.com</text>
</svg>
