<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // On the home page, start fetching the hero photo straight away, before the app code has loaded.
      // (This sits after the viewport tag on purpose: phones only report their real width once it is read.)
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.setAttribute('fetchpriority', 'high');
        l.href = matchMedia('(max-width: 700px)').matches ? '/hero-sky-mobile.webp' : '/hero-sky.webp';
        document.head.appendChild(l);
      }
    </script>
    <title>Mesón Sabika Education</title>
    <meta name="description" content="Server education tool for Mesón Sabika — study wines, fish, and more." />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://mesoneducation.com/" />
    <meta property="og:title"       content="Mesón Sabika Education" />
    <meta property="og:description" content="Server education tool for Mesón Sabika — study wines, fish, and more." />
    <meta property="og:image"       content="https://mesoneducation.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Mesón Sabika Education" />
    <meta name="twitter:description" content="Server education tool for Mesón Sabika — study wines, fish, and more." />
    <meta name="twitter:image"       content="https://mesoneducation.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
